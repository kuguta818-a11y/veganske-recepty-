<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zelený tanier – vegánske recepty a hotové jedlá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBF7; --ink:#1F2A24; --leaf:#3F7D4E; --mist:#E4EEDF;
  --beet:#8E2C5A; --turmeric:#E8A317; --line:#D5DFD0;
}
*{box-sizing:border-box;margin:0}
body{font-family:'PT Serif',Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3,button,input,.tag{font-family:'Rubik',system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--beet);outline-offset:2px}

header{padding:56px 20px 32px;max-width:1000px;margin:0 auto}
h1{font-size:clamp(2.4rem,8vw,4.5rem);line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--beet)}
header p{margin-top:16px;max-width:46ch;font-size:1.1rem}

.controls{max-width:1000px;margin:0 auto;padding:0 20px 24px;display:grid;gap:14px}
input[type=search]{width:100%;padding:14px 16px;font-size:1rem;border:2px solid var(--line);border-radius:10px;background:#fff}
input[type=search]:focus{border-color:var(--leaf);outline:none}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{padding:8px 16px;border:2px solid var(--line);background:#fff;border-radius:999px;font-size:.95rem;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}

main{max-width:1000px;margin:0 auto;padding:0 20px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column;font:inherit;color:inherit}
.card:hover{border-color:var(--leaf)}
.pic{height:130px;display:grid;place-items:center;font-size:4rem;background:var(--mist)}
.body{padding:16px}
.body h2{font-size:1.25rem;font-weight:500;line-height:1.25}
.body p{margin-top:6px;font-size:.95rem}
.meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--mist)}
.tag.time{background:#FBEFD0}
.empty{padding:40px 0;text-align:center}

dialog{border:none;border-radius:16px;max-width:640px;width:calc(100% - 32px);max-height:90vh;padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(31,42,36,.55)}
.dlg{padding:28px 24px 32px}
.dlg h2{font-size:1.8rem;font-weight:700;color:var(--beet);line-height:1.15;margin:8px 0 6px}
.dlg h3{margin:24px 0 8px;font-size:1.1rem}
.dlg ul,.dlg ol{padding-left:22px}
.dlg li{margin:4px 0}
.close{float:right;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.95rem}


.tabs{max-width:1000px;margin:0 auto;padding:0 20px 20px;display:flex;gap:8px}
.tabs button{flex:1;max-width:220px;padding:12px 18px;border:2px solid var(--leaf);background:#fff;color:var(--leaf);border-radius:10px;font-size:1rem;font-weight:500;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--leaf);color:#fff}
.dish{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.dish .body{flex:1;display:flex;flex-direction:column}
.dish .row{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-family:'Rubik',sans-serif;font-size:1.3rem;font-weight:700;color:var(--beet)}
.order{display:inline-block;padding:9px 16px;background:var(--beet);color:#fff;border-radius:8px;text-decoration:none;font-family:'Rubik',sans-serif;font-size:.95rem}
.order:hover{background:#6f2147}
.note{margin-top:28px;font-size:.9rem}
.tag.warn{background:#F6DDE8}

footer{text-align:center;padding:24px;border-top:1px solid var(--line);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Zelený tanier</h1>
  <p>Uvarte si podľa receptu, alebo si objednajte hotové jedlo. Všetko bez mäsa, mlieka a vajec.</p>
</header>

<nav class="tabs" aria-label="Sekcie">
  <button type="button" id="tab-recipes" aria-pressed="true">Recepty</button>
  <button type="button" id="tab-dishes" aria-pressed="false">Hotové jedlá</button>
</nav>

<section class="controls">
  <input type="search" id="search" placeholder="Nájdite recept alebo surovinu" aria-label="Vyhľadávanie receptov">
  <div class="filters" id="filters" role="group" aria-label="Kategórie"></div>
</section>

<main>
  <div class="grid" id="grid"></div>
  <p class="note" id="note" hidden>Ceny a alergény sú ukážkové. Pred spustením ich upravte podľa skutočnej ponuky.</p>
  <p class="empty" id="empty" hidden>Nič sa nenašlo. Skúste iný výraz alebo kategóriu.</p>
</main>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<footer>Zelený tanier · Objednávky: <a href="mailto:Kuguta818@gmail.com">Kuguta818@gmail.com</a></footer>

<script>
const ALL = 'Všetky';

// ===== PRIDÁVAJTE NOVÉ RECEPTY SEM =====
const recipes = [
  {
    title: "Šošovicová polievka s citrónom", category: "Polievka", emoji: "🍲", time: 35, servings: 4,
    desc: "Hustá hrejivá polievka z červenej šošovice.",
    ingredients: ["1 šálka červenej šošovice","1 cibuľa","2 mrkvy","3 strúčiky cesnaku","1 čl. kurkumy","1 čl. rímskeho kmínu","1 l vody alebo vývaru","šťava z polovice citróna","soľ, korenie, olivový olej"],
    steps: ["Cibuľu a mrkvu opekajte na oleji 5 minút.","Pridajte cesnak a korenie, varte minútu.","Pridajte prepláchnutú šošovicu a zalejte vodou.","Varte 20 minút do mäkka, potom rozmixujte ponorným mixérom.","Pridajte citrónovú šťavu, soľ a korenie."]
  },
  {
    title: "Tofu praženica", category: "Raňajky", emoji: "🍳", time: 15, servings: 2,
    desc: "Vegánska náhrada praženice: rýchla, sýta a bohatá na bielkoviny.",
    ingredients: ["250 g pevného tofu","1 paradajka","½ čl. kurkumy","1 pl. nutričných kvasníc","zelená cibuľka","soľ, čierne korenie","1 pl. oleja"],
    steps: ["Tofu roztlačte vidličkou.","Opekajte na oleji 3 minúty s kurkumou.","Pridajte nakrájanú paradajku a kvasnice.","Varte ďalších 5 minút a posypte zelenou cibuľkou."]
  },
  {
    title: "Cícerové kari so špenátom", category: "Hlavné jedlo", emoji: "🍛", time: 30, servings: 4,
    desc: "Voňavé kari na kokosovom mlieku.",
    ingredients: ["2 konzervy cícera (po 400 g)","400 ml kokosového mlieka","200 g špenátu","1 cibuľa","2 pl. kari pasty","1 konzerva krájaných paradajok","ryža na servírovanie"],
    steps: ["Cibuľu opečte do mäkka.","Pridajte kari pastu a opekajte minútu.","Vlejte paradajky a kokosové mlieko, privedte do varu.","Pridajte cícer a varte 15 minút.","Vložte špenát a nechajte 2 minúty. Podávajte s ryžou."]
  },
  {
    title: "Bowl s quinoou a avokádom", category: "Hlavné jedlo", emoji: "🥗", time: 25, servings: 2,
    desc: "Čerstvý obed: obilnina, zelenina a krémová omáčka.",
    ingredients: ["1 šálka quinoy","1 avokádo","1 uhorka","100 g červenej kapusty","1 šálka konzervovanej kukurice","2 pl. tahini","šťava z 1 citróna","soľ"],
    steps: ["Quinou uvarte podľa návodu na obale.","Nakrájajte zeleninu a avokádo.","Zmiešajte tahini, citrónovú šťavu, soľ a 2 pl. vody.","Do misky poukladajte quinou a zeleninu, polejte omáčkou."]
  },
  {
    title: "Hummus", category: "Predjedlo", emoji: "🧆", time: 10, servings: 4,
    desc: "Klasická nátierka z cícera s tahini.",
    ingredients: ["1 konzerva cícera (400 g)","3 pl. tahini","1 strúčik cesnaku","šťava z 1 citróna","3 pl. vody z cícera","olivový olej, paprika"],
    steps: ["Cícer scedťte, trochu tekutiny odložte.","Všetko rozmixujte do hladka.","Podávajte s olivovým olejom a paprikou."]
  },
  {
    title: "Čokoládová avokádová pena", category: "Dezert", emoji: "🍫", time: 10, servings: 2,
    desc: "Jemný dezert bez smotany a bez rafinovaného cukru.",
    ingredients: ["2 zrelé avokáda","3 pl. kakaa","3 pl. javorového sirupu","50 ml rastlinného mlieka","štipka soli","lesné ovocie na ozdobu"],
    steps: ["Všetko vložte do mixéra.","Mixujte do hladkého krému.","Vychlaďte 30 minút a podávajte s lesným ovocím."]
  }
];
// =========================================


const ORDER_EMAIL = 'Kuguta818@gmail.com';
// ===== HOTOVÉ JEDLÁ: UPRAVTE NÁZVY, CENY A ALERGÉNY =====
const dishes = [
  { title: "Falafel s hummusom", emoji: "🧆", price: "6,90 €", weight: "350 g", allergens: ["sezam"], desc: "Chrumkavé cícerové guľky, hummus, čerstvá zelenina a pita." },
  { title: "Tofu pad thai", emoji: "🍜", price: "8,50 €", weight: "400 g", allergens: ["sója","arašidy","lepok"], desc: "Ryžové rezance, tofu, arašidy a limetková omáčka." },
  { title: "Zeleninová lasagne", emoji: "🍝", price: "7,90 €", weight: "380 g", allergens: ["lepok","orechy"], desc: "Cukina, baklažán a paradajková omáčka s kešu bešamelom." },
  { title: "Šošovicové karbonátky", emoji: "🥔", price: "7,20 €", weight: "400 g", allergens: ["lepok"], desc: "Karbonátky z červenej šošovice so zemiakovou kašou." },
  { title: "Cícerový šalát", emoji: "🥙", price: "5,90 €", weight: "300 g", allergens: ["sezam"], desc: "Cícer, uhorka, paradajky, petržlen a citrónový dresing." },
  { title: "Čokoládové brownies", emoji: "🍫", price: "3,50 €", weight: "90 g", allergens: ["lepok","orechy"], desc: "Vlhké brownies z kakaa a vlašských orechov." }
];
// ======================================================

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const filtersEl = document.getElementById('filters');
const dlg = document.getElementById('dlg');
const categories = [ALL, ...new Set(recipes.map(r => r.category))];
let activeCat = ALL;
let tab = 'recipes';
const note = document.getElementById('note');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function renderFilters(){
  filtersEl.innerHTML = '';
  categories.forEach(c => {
    const b = el('button', '', c);
    b.type = 'button';
    b.setAttribute('aria-pressed', c === activeCat);
    b.onclick = () => { activeCat = c; renderFilters(); renderGrid(); };
    filtersEl.append(b);
  });
}

function renderDishes(q){
  const list = dishes.filter(d => !q || (d.title + ' ' + d.desc).toLowerCase().includes(q));
  grid.innerHTML = '';
  list.forEach(d => {
    const card = el('div', 'dish');
    card.append(el('div', 'pic', d.emoji));
    const body = el('div', 'body');
    body.append(el('h2', '', d.title), el('p', '', d.desc));
    const meta = el('div', 'meta');
    meta.append(el('span', 'tag time', d.weight));
    d.allergens.forEach(a => meta.append(el('span', 'tag warn', a)));
    body.append(meta);
    const row = el('div', 'row');
    const order = el('a', 'order', 'Objednať');
    order.href = 'mailto:' + ORDER_EMAIL + '?subject=' + encodeURIComponent('Objednávka: ' + d.title);
    row.append(el('span', 'price', d.price), order);
    body.append(row);
    card.append(body);
    grid.append(card);
  });
  empty.hidden = list.length > 0;
}

function renderGrid(){
  const q = search.value.trim().toLowerCase();
  if (tab === 'dishes') return renderDishes(q);
  const list = recipes.filter(r =>
    (activeCat === ALL || r.category === activeCat) &&
    (!q || (r.title + ' ' + r.desc + ' ' + r.ingredients.join(' ')).toLowerCase().includes(q))
  );
  grid.innerHTML = '';
  list.forEach(r => {
    const card = el('button', 'card');
    card.type = 'button';
    card.append(el('div', 'pic', r.emoji));
    const body = el('div', 'body');
    body.append(el('h2', '', r.title), el('p', '', r.desc));
    const meta = el('div', 'meta');
    meta.append(el('span', 'tag', r.category), el('span', 'tag time', r.time + ' min'));
    body.append(meta);
    card.append(body);
    card.onclick = () => openRecipe(r);
    grid.append(card);
  });
  empty.hidden = list.length > 0;
}

function openRecipe(r){
  dlg.innerHTML = '';
  const wrap = el('div', 'dlg');
  const close = el('button', 'close', 'Zavrieť');
  close.onclick = () => dlg.close();
  const title = el('h2', '', r.emoji + ' ' + r.title);
  title.id = 'dlg-title';
  wrap.append(close, title, el('p', '', r.time + ' min · porcií: ' + r.servings));
  wrap.append(el('h3', '', 'Suroviny'));
  const ul = el('ul');
  r.ingredients.forEach(i => ul.append(el('li', '', i)));
  wrap.append(ul, el('h3', '', 'Príprava'));
  const ol = el('ol');
  r.steps.forEach(s => ol.append(el('li', '', s)));
  wrap.append(ol);
  dlg.append(wrap);
  dlg.showModal();
}

dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
search.addEventListener('input', renderGrid);
function setTab(t){
  tab = t;
  document.getElementById('tab-recipes').setAttribute('aria-pressed', t === 'recipes');
  document.getElementById('tab-dishes').setAttribute('aria-pressed', t === 'dishes');
  filtersEl.hidden = t === 'dishes';
  note.hidden = t !== 'dishes';
  search.placeholder = t === 'dishes' ? 'Nájdite hotové jedlo' : 'Nájdite recept alebo surovinu';
  renderGrid();
}
document.getElementById('tab-recipes').onclick = () => setTab('recipes');
document.getElementById('tab-dishes').onclick = () => setTab('dishes');
renderFilters();
renderGrid();
</script>
</body>
</html>
